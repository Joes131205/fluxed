version: "3.8"

services:
    api:
        build:
            context: .
            dockerfile: apps/server/Dockerfile
        ports:
            - "3000:3000"
        volumes:
            - ./:/app
            - /apps/node_modules
        env_file:
            - apps/server/.env
        depends_on:
            - db
    db:
        image: postgres:17-alpine
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_USER=${DB_USER}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
            - POSTGRES_DB=${DB_NAME}
        volumes:
            - pg_data:/var/lib/postgresql/data

volumes:
    pg_data:
